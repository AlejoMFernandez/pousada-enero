<section class="pg-hero" aria-labelledby="pg-t">
  <div class="wrap pg-hero__grid">
    <div class="pg-hero__txt">
      <p class="eyebrow rv">{{pg.eyebrow}}</p>
      <h1 id="pg-t" class="h2 pg-hero__t rv">{{pg.h1}}</h1>
      <img class="ola rv" src="/img/trazo-ola.svg" alt="" width="170" height="26">
      <p class="lead rv">{{pg.lead}}</p>
      <a class="btn btn--azul rv" href="{{WA}}" target="_blank" rel="noopener">{{wa_label}}</a>
    </div>
    <figure class="pg-hero__fig reveal">[[img play-3 50 pg.p1t eager]]</figure>
  </div>
</section>

<section class="pg-tours">
  <div class="wrap">
    <div class="pg-tours__grid">
      <article class="tour rv"><figure>[[img play-47 33 pg.p1t]]</figure><h2 class="tour__t">{{pg.p1t}}</h2><p>{{pg.p1p}}</p></article>
      <article class="tour rv"><figure>[[img expe-14 33 pg.p2t]]</figure><h2 class="tour__t">{{pg.p2t}}</h2><p>{{pg.p2p}}</p></article>
      <article class="tour rv"><figure>[[img play-40 33 pg.p3t]]</figure><h2 class="tour__t">{{pg.p3t}}</h2><p>{{pg.p3p}}</p></article>
      <article class="tour rv"><figure>[[img expe-11 33 pg.p4t]]</figure><h2 class="tour__t">{{pg.p4t}}</h2><p>{{pg.p4p}}</p></article>
      <article class="tour rv"><figure>[[img expe-9 33 pg.p5t]]</figure><h2 class="tour__t">{{pg.p5t}}</h2><p>{{pg.p5p}}</p></article>
      <article class="tour rv"><figure class="tour__ph"><img src="/img/icons/icono-passeios.svg" alt="" width="72" height="72"></figure><h2 class="tour__t">{{pg.p6t}}</h2><p>{{pg.p6p}}</p></article>
    </div>
  </div>
</section>

<section class="pg-full">
  <figure class="pg-full__fig">[[img play-35 100 pg.pdt]]</figure>
  <div class="wrap pg-full__txt"><div class="pg-full__card rv"><h2 class="h2 h2--m">{{pg.pdt}}</h2><p class="lead">{{pg.pdp}}</p></div></div>
</section>

{{CTA_WA}}
